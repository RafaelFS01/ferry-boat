name: Boat CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ferry-boat
    env:
      TELEMETRY_PROTO_PATH: ${{ github.workspace }}/orchestrator/proto/telemetry.proto
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: ferry-boat
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: RafaelFS01/ferry-telemetry-tde
          ref: main
          path: orchestrator
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ferry-boat/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
